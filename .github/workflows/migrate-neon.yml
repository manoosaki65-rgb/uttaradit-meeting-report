name: Run one-time D1 to Neon migration
on:
  push:
    branches: [neon-test]
    paths:
      - ".github/workflows/migrate-neon.yml"
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare auto-deploy
        run: sleep 75
      - name: Run migration
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 6 --retry-delay 10             "https://uttaradit-meeting-report.manoosaki65.workers.dev/api/migrate-d1-to-neon"             | tee migration.json
          grep -q '"ok":true' migration.json
      - name: Verify counts
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 6 --retry-delay 10             "https://uttaradit-meeting-report.manoosaki65.workers.dev/api/migration-status"             | tee status.json
