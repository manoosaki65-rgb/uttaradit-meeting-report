<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ลงชื่อเข้าร่วมประชุม</title><link rel="stylesheet" href="./styles.css"><style>.att-wrap{max-width:760px;margin:0 auto;padding:18px}.att-head{background:linear-gradient(135deg,#123d66,#176a79);color:white;padding:22px;border-radius:18px;margin-bottom:14px}.att-head h1{margin:0;font-size:25px}.person-list{display:flex;flex-direction:column;gap:9px}.person{background:white;border:1px solid #e1e8ee;border-radius:13px;padding:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}.person.signed{border-left:5px solid #32a268}.person .role{font-size:12px;color:#758696}.sign-card{background:white;padding:16px;border-radius:15px;border:1px solid #e1e8ee;margin-top:14px}.canvas-wrap{border:1px dashed #9badbb;border-radius:12px;background:white;overflow:hidden}.canvas-wrap canvas{display:block;width:100%;height:170px;touch-action:none}.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.status-grid label{font-weight:600;background:#f5f8fa;padding:9px;border-radius:10px;display:block}.back{display:inline-block;margin-bottom:10px;text-decoration:none;color:#24567b}@media(max-width:520px){.status-grid{grid-template-columns:1fr}.person{align-items:flex-start;flex-direction:column}}</style></head>
<body><main class="att-wrap"><a class="back" href="./">← กลับหน้ารายงานการประชุม</a><section class="att-head"><p class="eyebrow">ลงชื่ออิเล็กทรอนิกส์</p><h1 id="meetingName">รายชื่อผู้เข้าร่วมประชุม</h1><p id="meetingDate"></p></section><div id="personList" class="person-list"></div><section id="signCard" class="sign-card" hidden><h3 id="selectedName"></h3><p id="selectedRole"></p><div class="status-grid"><label><input type="radio" name="status" value="present" checked> เข้าร่วมประชุม</label><label><input type="radio" name="status" value="vacation"> ลาพักผ่อน</label><label><input type="radio" name="status" value="official"> ติดราชการ</label><label><input type="radio" name="status" value="personal"> ลากิจ</label><label><input type="radio" name="status" value="sick"> ลาป่วย</label></div><label>หมายเหตุ (ถ้ามี)<input id="attNote"></label><p><b>ลงลายมือชื่อด้วยนิ้วหรือปากกา</b></p><div class="canvas-wrap"><canvas id="sigCanvas" width="720" height="220"></canvas></div><div class="box-actions"><button class="ghost" id="clearSig">ล้างลายเซ็น</button><button class="primary" id="saveSig">ยืนยันและลงชื่อ</button></div></section></main><div class="toast" id="toast" hidden></div><script src="./attendance.js"></script></body></html>
